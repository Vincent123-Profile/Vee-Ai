<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vee AI 🇳🇬 — Built by Agboola Vincent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #181818; color: #f5f5f5; display: flex; justify-content: center; height: 100dvh; }
    .app { width: 100%; max-width: 520px; background: #222222; display: flex; flex-direction: column; height: 100dvh; border-left: 1px solid #333; border-right: 1px solid #333; }
    .header { background: #1B4D3E; padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: #F14C15; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; color: #fff; flex-shrink: 0; }
    .header-info h1 { font-size: 16px; font-weight: 700; }
    .header-info p { font-size: 12px; color: #cde7de; }
    .chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #1c1c1c; }
    .msg { max-width: 82%; padding: 11px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.45; word-wrap: break-word; }
    .bot { background: #2F2E2E; color: #ffffff; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #3c3c3c; }
    .user { background: #1B4D3E; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px; background: #222222; border-top: 1px solid #333; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { background: #2F2E2E; color: #f5f5f5; border: 1px solid #444; padding: 7px 12px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .chip:hover { background: #F14C15; border-color: #F14C15; }
    .input-area { display: flex; gap: 8px; padding: 12px; background: #222222; border-top: 1px solid #333; }
    input { flex: 1; background: #2F2E2E; border: 1px solid #444; border-radius: 24px; padding: 11px 16px; color: #fff; font-size: 14.5px; outline: none; }
    input:focus { border-color: #F14C15; }
    button.send { background: #F14C15; color: #fff; border: none; border-radius: 24px; padding: 0 18px; font-weight: 700; font-size: 14px; cursor: pointer; }
    button.send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="avatar">V</div>
      <div class="header-info">
        <h1>Vee AI 🇳🇬</h1>
        <p>Online • Built by Agboola Vincent (Boss Vee)</p>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">How far my guy! Welcome to <b>Vee AI</b>—built from scratch by big boss <b>Agboola Vincent</b>. I no dey speak big grammar here, na pure Pidgin cruise. Wetin dey sup?</div>
    </div>

    <div class="chips">
      <button class="chip" onclick="quickSend('Who build you?')">Who build you? 🤔</button>
      <button class="chip" onclick="quickSend('Abeg borrow me urgent 2k I wan chop')">Borrow me urgent 2k 💸</button>
      <button class="chip" onclick="quickSend('Have you eaten today?')">Have you eaten? 🍲</button>
      <button class="chip" onclick="quickSend('Tell me one funny Nigerian story')">Funny street story 😂</button>
      <button class="chip" onclick="quickSend('Tell me something funny about Agboola Vincent')">Roast Boss Vee 🔥</button>
    </div>

    <form class="input-area" id="chatForm">
      <input type="text" id="userInput" placeholder="Yarn with Vee AI in Pidgin..." autocomplete="off" required />
      <button type="submit" class="send" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    let history = [];

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function quickSend(text) {
      userInput.value = text;
      chatForm.dispatchEvent(new Event("submit"));
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      addMessage(message, "user");
      userInput.value = "";
      sendBtn.disabled = true;

      const typingBubble = addMessage("Vee AI dey type...", "bot");

      try {
        const res = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await res.json();
        const reply = data.reply || "Chai, network small hook me! Try send am again.";
        typingBubble.textContent = reply;

        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: reply });
        if (history.length > 12) history = history.slice(-12);
      } catch (err) {
        typingBubble.textContent = "Omo, small network wahala happen! Check your data and try again.";
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
